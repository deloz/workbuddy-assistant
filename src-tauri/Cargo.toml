[package]
name = "workbuddy-assistant"
version = "0.0.8"
description = "WorkBuddy multi-account credit and daily check-in assistant"
edition = "2024"
rust-version = "1.95"

[lints.rust]
unsafe_code = "forbid"

# 与 CI 的 `cargo clippy --all-targets -- -D warnings` 叠加，把 pedantic 作为长期基线；
# 个别确有必要放宽的地方用带 reason 的 #[allow] 就地说明。
[lints.clippy]
pedantic = "warn"

[lib]
name = "workbuddy_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }

# 开机启动只在当前用户的 Run 项里写注册表，不改动系统级启动项。
[target.'cfg(windows)'.dependencies]
auto-launch = "0.6"

[profile.release]
lto = "thin"
strip = "symbols"
